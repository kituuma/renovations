<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Renovation Tracker</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- SUPABASE CONFIG ---
        const SUPABASE_URL = 'https://cfmpxtsszqvbrgdgdumf.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_GiahwsiF8XMQ79X8Y-B0Vw_RDl-ZwD1';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- ICONS ---
        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        // --- HELPER FUNCTIONS ---
        const calculateDuration = (start, end) => {
            if (!start || !end) return 0;
            const [startH, startM] = start.split(':').map(Number);
            const [endH, endM] = end.split(':').map(Number);
            const startDate = new Date(0, 0, 0, startH, startM);
            const endDate = new Date(0, 0, 0, endH, endM);
            let diff = (endDate - startDate) / 1000 / 60 / 60; 
            if (diff < 0) diff += 24; 
            return diff;
        };

        const formatCurrency = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(val);
        const formatHours = (val) => `${val.toFixed(2)} hrs`;
        const formatDate = (dateStr) => {
            if (!dateStr) return '';
            const [y, m, d] = dateStr.split('-');
            return `${m}/${d}`;
        };

        function App() {
            const [entries, setEntries] = useState([]);
            const [loading, setLoading] = useState(true);
            const [hasLocalData, setHasLocalData] = useState(false);
            
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingEntry, setEditingEntry] = useState(null);
            const [formData, setFormData] = useState({
                date: new Date().toISOString().split('T')[0],
                startTime: '',
                endTime: '',
                notes: '',
                type: 'work'
            });

            // Load Cloud Data
            const fetchEntries = async () => {
                setLoading(true);
                const { data, error } = await supabaseClient
                    .from('renovations')
                    .select('*')
                    .order('date', { ascending: false });
                
                if (!error && data) setEntries(data);
                setLoading(false);
            };

            useEffect(() => {
                fetchEntries();
                // Check if this specific device has old "trapped" data
                const local = localStorage.getItem('renovation_entries');
                if (local && JSON.parse(local).length > 0) {
                    setHasLocalData(true);
                }
            }, []);

            // Migrate LocalStorage -> Cloud
            const handleSyncLocalData = async () => {
                const localData = JSON.parse(localStorage.getItem('renovation_entries') || '[]');
                if (confirm(`Move ${localData.length} items from phone to Cloud?`)) {
                    // Filter out IDs that might conflict or let Supabase handle upsert
                    const { error } = await supabaseClient.from('renovations').upsert(localData);
                    if (!error) {
                        localStorage.removeItem('renovation_entries'); 
                        setHasLocalData(false);
                        fetchEntries();
                        alert("Migration successful! Everything is now synced.");
                    } else {
                        alert("Sync error: " + error.message);
                    }
                }
            };

            const stats = useMemo(() => {
                const totalDebt = 2000;
                const totalHoursTarget = 104;
                const hourlyRate = totalDebt / totalHoursTarget;
                let hoursWorked = entries.reduce((acc, e) => 
                    (e.type === 'work' && e.startTime && e.endTime) ? acc + calculateDuration(e.startTime, e.endTime) : acc, 0);

                const valueEarned = hoursWorked * hourlyRate;
                return { 
                    hourlyRate, hoursWorked, valueEarned, 
                    remainingBalance: totalDebt - valueEarned, 
                    remainingHours: Math.max(0, totalHoursTarget - hoursWorked), 
                    percentComplete: Math.min(100, (valueEarned / totalDebt) * 100) 
                };
            }, [entries]);

            const handleSave = async () => {
                if (formData.type === 'work' && (!formData.startTime || !formData.endTime)) {
                    alert("Please enter times for work.");
                    return;
                }

                const newEntry = { 
                    ...formData, 
                    id: editingEntry ? editingEntry.id : Date.now().toString(), 
                    status: formData.type === 'missed' ? 'missed' : 'completed' 
                };

                const { error } = await supabaseClient.from('renovations').upsert([newEntry]);
                
                if (!error) {
                    fetchEntries();
                    closeModal();
                } else {
                    alert("Save failed: " + error.message);
                }
            };

            const handleDelete = async (id) => {
                if (confirm("Delete this entry?")) {
                    const { error } = await supabaseClient.from('renovations').delete().eq('id', id);
                    if (!error) fetchEntries();
                }
            };

            const openModal = (entry = null) => {
                setEditingEntry(entry);
                setFormData(entry ? { ...entry } : { 
                    date: new Date().toISOString().split('T')[0], 
                    startTime: '', endTime: '', notes: '', type: 'work' 
                });
                setIsModalOpen(true);
            };

            const closeModal = () => { setIsModalOpen(false); setEditingEntry(null); };

            return (
                <div className="pb-24">
                    {/* Sticky Header */}
                    <div className="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-10 pt-4 pb-4 px-4">
                        <div className="max-w-md mx-auto">
                            {hasLocalData && (
                                <button onClick={handleSyncLocalData} className="w-full mb-4 bg-orange-500 text-white p-3 rounded-xl text-sm font-bold flex items-center justify-between shadow-lg animate-pulse">
                                    <span>Sync Phone Data to Cloud</span>
                                    <Icon name="upload-cloud" size={18} />
                                </button>
                            )}

                            <div className="flex justify-between items-center mb-4">
                                <h1 className="text-lg font-bold text-slate-900">Renovation Tracker</h1>
                                <div className="text-right">
                                    <div className="text-xl font-bold text-blue-600">{formatCurrency(stats.remainingBalance)}</div>
                                    <p className="text-[10px] text-slate-400 uppercase tracking-wider font-bold">Debt Left</p>
                                </div>
                            </div>

                            <div className="relative h-3 bg-slate-100 rounded-full overflow-hidden mb-2">
                                <div className="absolute top-0 left-0 h-full bg-blue-500 transition-all duration-500" style={{ width: `${stats.percentComplete}%` }}></div>
                            </div>
                            <div className="flex justify-between text-[10px] text-slate-500 font-bold uppercase tracking-wide">
                                <span>{formatHours(stats.hoursWorked)} worked</span>
                                <span>{formatHours(stats.remainingHours)} left</span>
                            </div>
                        </div>
                    </div>

                    {/* List Area */}
                    <div className="max-w-md mx-auto px-4 py-4 space-y-3">
                        {loading ? (
                            <div className="text-center py-20">
                                <div className="animate-spin inline-block w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full mb-4"></div>
                                <p className="text-slate-400 font-medium">Fetching Cloud Data...</p>
                            </div>
                        ) : entries.length === 0 ? (
                            <p className="text-center py-20 text-slate-400">No entries found. Tap + to start.</p>
                        ) : 
                        entries.map(entry => {
                            const duration = calculateDuration(entry.startTime, entry.endTime);
                            const value = duration * stats.hourlyRate;
                            const isMissed = entry.type === 'missed';

                            return (
                                <div key={entry.id} onClick={() => openModal(entry)} className={`bg-white rounded-xl p-4 shadow-sm border-l-4 flex justify-between items-start active:scale-[0.98] transition-all cursor-pointer ${isMissed ? 'border-red-400 opacity-80' : 'border-blue-500'}`}>
                                    <div className="flex-1">
                                        <div className="flex items-center gap-2 mb-1">
                                            <span className="font-bold text-slate-700">{formatDate(entry.date)}</span>
                                            {isMissed ? <span className="text-[10px] bg-red-100 text-red-600 px-2 py-0.5 rounded-full font-bold uppercase">Missed</span> : <span className="text-xs text-slate-400 font-medium">{entry.startTime} - {entry.endTime}</span>}
                                        </div>
                                        <p className="text-sm text-slate-600 leading-snug line-clamp-1 italic">{entry.notes || "No notes logged"}</p>
                                    </div>
                                    <div className="text-right">
                                        {!isMissed && (
                                            <div className="flex flex-col items-end">
                                                <span className="font-bold text-slate-800">{formatCurrency(value)}</span>
                                                <span className="text-[10px] text-slate-400 font-bold">{formatHours(duration)}</span>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* Add Button */}
                    <button onClick={() => openModal()} className="fixed bottom-6 right-6 bg-blue-600 text-white w-16 h-16 rounded-full shadow-2xl flex items-center justify-center active:scale-90 z-20 hover:bg-blue-700 transition-colors">
                        <Icon name="plus" size={32} />
                    </button>

                    {/* Entry Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm p-4">
                            <div className="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl overflow-hidden animate-in slide-in-from-bottom-5">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-lg font-bold text-slate-800">{editingEntry ? 'Update Entry' : 'Log Work'}</h3>
                                    <button onClick={closeModal} className="p-2 bg-slate-100 rounded-full text-slate-500"><Icon name="x" size={20} /></button>
                                </div>
                                <div className="space-y-4">
                                    <div className="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl">
                                        {['work', 'missed'].map(t => (
                                            <button key={t} onClick={() => setFormData({...formData, type: t})} className={`py-3 text-sm font-bold rounded-lg transition-all ${formData.type === t ? 'bg-white shadow text-blue-600' : 'text-slate-400'}`}>
                                                {t === 'work' ? 'Worked' : 'Missed Day'}
                                            </button>
                                        ))}
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Date</label>
                                        <input type="date" value={formData.date} onChange={(e) => setFormData({...formData, date: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none" />
                                    </div>
                                    {formData.type === 'work' && (
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Start</label>
                                                <input type="time" value={formData.startTime} onChange={(e) => setFormData({...formData, startTime: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl" />
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">End</label>
                                                <input type="time" value={formData.endTime} onChange={(e) => setFormData({...formData, endTime: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl" />
                                            </div>
                                        </div>
                                    )}
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Notes</label>
                                        <textarea value={formData.notes} onChange={(e) => setFormData({...formData, notes: e.target.value})} placeholder="What did you work on?" rows={3} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl resize-none outline-none focus:border-blue-500" />
                                    </div>
                                    <div className="flex gap-3 pt-2">
                                        {editingEntry && <button onClick={() => handleDelete(editingEntry.id)} className="p-4 rounded-xl bg-red-50 text-red-500 font-bold transition-colors"><Icon name="trash-2" size={20} /></button>}
                                        <button onClick={handleSave} className="flex-1 py-4 bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:bg-blue-700 active:scale-95 transition-all">Save Changes</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
