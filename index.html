<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Renovation Tracker</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- SUPABASE CONFIG ---
        const SUPABASE_URL = 'https://cfmpxtsszqvbrgdgdumf.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_GiahwsiF8XMQ79X8Y-B0Vw_RDl-ZwD1';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- ICONS ---
        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        // --- HELPER FUNCTIONS ---
        const calculateDuration = (start, end) => {
            if (!start || !end) return 0;
            const [startH, startM] = start.split(':').map(Number);
            const [endH, endM] = end.split(':').map(Number);
            const startDate = new Date(0, 0, 0, startH, startM);
            const endDate = new Date(0, 0, 0, endH, endM);
            let diff = (endDate - startDate) / 1000 / 60 / 60; 
            if (diff < 0) diff += 24; 
            return diff;
        };

        const formatCurrency = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(val);
        const formatHours = (val) => `${val.toFixed(2)} hrs`;
        const formatDate = (dateStr) => {
            if (!dateStr) return '';
            const [y, m, d] = dateStr.split('-');
            return `${m}/${d}`;
        };

        function App() {
            const [entries, setEntries] = useState([]);
            const [loading, setLoading] = useState(true);
            const [hasLocalData, setHasLocalData] = useState(false);
            const [isContractorMode, setIsContractorMode] = useState(false);
            
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingEntry, setEditingEntry] = useState(null);
            const [formData, setFormData] = useState({
                date: new Date().toISOString().split('T')[0],
                startTime: '', endTime: '', notes: '', type: 'work'
            });

            const fetchEntries = async () => {
                setLoading(true);
                const { data, error } = await supabaseClient
                    .from('renovations')
                    .select('*')
                    .order('date', { ascending: false });
                
                if (!error && data) setEntries(data);
                setLoading(false);
            };

            useEffect(() => {
                fetchEntries();
                const local = localStorage.getItem('renovation_entries');
                if (local && JSON.parse(local).length > 0) setHasLocalData(true);
            }, []);

            const handleSyncLocalData = async () => {
                const localData = JSON.parse(localStorage.getItem('renovation_entries') || '[]');
                if (confirm(`Move ${localData.length} items to Cloud?`)) {
                    const { error } = await supabaseClient.from('renovations').upsert(localData);
                    if (!error) {
                        localStorage.removeItem('renovation_entries'); 
                        setHasLocalData(false);
                        fetchEntries();
                    }
                }
            };

            const stats = useMemo(() => {
                const totalDebt = 2000;
                const totalHoursTarget = 104;
                const hourlyRate = totalDebt / totalHoursTarget;
                let hoursWorked = entries.reduce((acc, e) => 
                    (e.type === 'work' && e.startTime && e.endTime) ? acc + calculateDuration(e.startTime, e.endTime) : acc, 0);

                const valueEarned = hoursWorked * hourlyRate;
                return { 
                    hourlyRate, hoursWorked, valueEarned, 
                    remainingBalance: totalDebt - valueEarned, 
                    remainingHours: Math.max(0, totalHoursTarget - hoursWorked), 
                    percentComplete: Math.min(100, (valueEarned / totalDebt) * 100) 
                };
            }, [entries]);

            const handleSave = async () => {
                if (formData.type === 'work' && (!formData.startTime || !formData.endTime)) {
                    alert("Please enter times.");
                    return;
                }

                const newEntry = { 
                    ...formData, 
                    id: editingEntry ? editingEntry.id : Date.now().toString(), 
                    status: formData.type === 'missed' ? 'missed' : 'completed',
                    is_confirmed: editingEntry ? editingEntry.is_confirmed : false 
                };

                const { error } = await supabaseClient.from('renovations').upsert([newEntry]);
                if (!error) { fetchEntries(); closeModal(); }
            };

            const handleDelete = async (id) => {
                if (confirm("Delete this entry?")) {
                    const { error } = await supabaseClient.from('renovations').delete().eq('id', id);
                    if (!error) fetchEntries();
                }
            };

            const handleToggleConfirm = async (id, currentStatus) => {
                const { error } = await supabaseClient
                    .from('renovations')
                    .update({ is_confirmed: !currentStatus })
                    .eq('id', id);
                if (!error) fetchEntries();
            };

            const openModal = (entry = null) => {
                setEditingEntry(entry);
                setFormData(entry ? { ...entry } : { 
                    date: new Date().toISOString().split('T')[0], 
                    startTime: '', endTime: '', notes: '', type: 'work' 
                });
                setIsModalOpen(true);
            };

            const closeModal = () => { setIsModalOpen(false); setEditingEntry(null); };

            return (
                <div className="pb-24">
                    {/* Header */}
                    <div className="bg-white shadow-sm border-b sticky top-0 z-10 p-4">
                        <div className="max-w-md mx-auto">
                            {hasLocalData && (
                                <button onClick={handleSyncLocalData} className="w-full mb-4 bg-orange-500 text-white p-3 rounded-xl text-sm font-bold flex justify-between items-center shadow-lg">
                                    <span>Sync Phone Data</span>
                                    <Icon name="upload-cloud" size={18} />
                                </button>
                            )}

                            <div className="flex justify-between items-center mb-4">
                                <div>
                                    <h1 className="text-lg font-bold text-slate-900 leading-none mb-1">Renovations</h1>
                                    <button 
                                        onClick={() => setIsContractorMode(!isContractorMode)}
                                        className={`text-[10px] px-2 py-0.5 rounded-full font-bold uppercase ${isContractorMode ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-500'}`}
                                    >
                                        {isContractorMode ? 'Contractor Mode' : 'Owner Mode'}
                                    </button>
                                </div>
                                <div className="text-right">
                                    <div className="text-xl font-bold text-blue-600">{formatCurrency(stats.remainingBalance)}</div>
                                    <p className="text-[10px] text-slate-400 uppercase font-bold">Remaining</p>
                                </div>
                            </div>

                            <div className="relative h-2 bg-slate-100 rounded-full overflow-hidden mb-2">
                                <div className="absolute h-full bg-blue-500 transition-all duration-500" style={{ width: `${stats.percentComplete}%` }}></div>
                            </div>
                            <div className="flex justify-between text-[10px] text-slate-500 font-bold uppercase">
                                <span>{formatHours(stats.hoursWorked)} worked</span>
                                <span>{formatHours(stats.remainingHours)} left</span>
                            </div>
                        </div>
                    </div>

                    {/* List Area */}
                    <div className="max-w-md mx-auto px-4 py-4 space-y-3">
                        {loading ? <div className="text-center py-20 text-slate-400 font-bold">Loading Cloud Data...</div> : 
                        entries.map(entry => {
                            const duration = calculateDuration(entry.startTime, entry.endTime);
                            const value = duration * stats.hourlyRate;
                            const isMissed = entry.type === 'missed';

                            return (
                                <div key={entry.id} className={`bg-white rounded-xl p-4 shadow-sm border-l-4 flex justify-between items-center transition-all ${isMissed ? 'border-red-400 opacity-80' : 'border-blue-500'}`}>
                                    <div onClick={() => openModal(entry)} className="flex-1 cursor-pointer">
                                        <div className="flex items-center gap-2 mb-1">
                                            <span className="font-bold text-slate-700">{formatDate(entry.date)}</span>
                                            {isMissed ? <span className="text-[10px] bg-red-100 text-red-600 px-2 py-0.5 rounded-full font-bold uppercase">Missed</span> : <span className="text-xs text-slate-400 font-medium">{entry.startTime} - {entry.endTime}</span>}
                                        </div>
                                        {/* Updated notes: whitespace support and no clipping */}
                                        <p className="text-sm text-slate-600 italic whitespace-pre-wrap">{entry.notes || "No notes logged"}</p>
                                        {entry.is_confirmed && (
                                            <div className="flex items-center gap-1 text-[10px] text-green-600 font-bold mt-2 uppercase">
                                                <Icon name="check-circle" size={12} /> Confirmed by Contractor
                                            </div>
                                        )}
                                    </div>
                                    
                                    <div className="flex items-center gap-3">
                                        {!isMissed && !isContractorMode && (
                                            <div className="text-right">
                                                <div className="font-bold text-slate-800 text-sm">{formatCurrency(value)}</div>
                                                <div className="text-[10px] text-slate-400 font-bold">{formatHours(duration)}</div>
                                            </div>
                                        )}
                                        {isContractorMode && (
                                            <button 
                                                onClick={(e) => { e.stopPropagation(); handleToggleConfirm(entry.id, entry.is_confirmed); }}
                                                className={`p-2 rounded-lg border-2 transition-all ${entry.is_confirmed ? 'bg-green-500 border-green-500 text-white' : 'border-slate-200 text-slate-300'}`}
                                            >
                                                <Icon name="check" size={24} />
                                            </button>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* FAB (Hidden for Contractor) */}
                    {!isContractorMode && (
                        <button onClick={() => openModal()} className="fixed bottom-6 right-6 bg-blue-600 text-white w-16 h-16 rounded-full shadow-2xl flex items-center justify-center active:scale-90 z-20"><Icon name="plus" size={32} /></button>
                    )}

                    {/* Entry Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm p-4">
                            <div className="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl animate-in slide-in-from-bottom-5">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-lg font-bold text-slate-800">{isContractorMode ? 'View Details' : (editingEntry ? 'Update Entry' : 'Log Work')}</h3>
                                    <button onClick={closeModal} className="p-2 bg-slate-100 rounded-full text-slate-500"><Icon name="x" size={20} /></button>
                                </div>
                                <div className="space-y-4">
                                    {/* Inputs are disabled for Contractor Mode */}
                                    <div className="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl">
                                        {['work', 'missed'].map(t => (
                                            <button key={t} disabled={isContractorMode} onClick={() => setFormData({...formData, type: t})} className={`py-3 text-sm font-bold rounded-lg transition-all ${formData.type === t ? 'bg-white shadow text-blue-600' : 'text-slate-400'}`}>
                                                {t === 'work' ? 'Worked' : 'Missed'}
                                            </button>
                                        ))}
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Date</label>
                                        <input type="date" readOnly={isContractorMode} value={formData.date} onChange={(e) => setFormData({...formData, date: e.target.value})} className="w-full p-3 bg-slate-50 border rounded-xl outline-none" />
                                    </div>
                                    {formData.type === 'work' && (
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Start</label>
                                                <input type="time" readOnly={isContractorMode} value={formData.startTime} onChange={(e) => setFormData({...formData, startTime: e.target.value})} className="w-full p-3 bg-slate-50 border rounded-xl" />
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">End</label>
                                                <input type="time" readOnly={isContractorMode} value={formData.endTime} onChange={(e) => setFormData({...formData, endTime: e.target.value})} className="w-full p-3 bg-slate-50 border rounded-xl" />
                                            </div>
                                        </div>
                                    )}
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Notes</label>
                                        <textarea readOnly={isContractorMode} value={formData.notes} onChange={(e) => setFormData({...formData, notes: e.target.value})} placeholder="Notes..." rows={5} className="w-full p-3 bg-slate-50 border rounded-xl resize-none outline-none focus:border-blue-500" />
                                    </div>
                                    
                                    {/* Action Buttons toggle based on Mode */}
                                    {!isContractorMode ? (
                                        <div className="flex gap-3 pt-2">
                                            {editingEntry && <button onClick={() => handleDelete(editingEntry.id)} className="p-4 rounded-xl bg-red-50 text-red-500 font-bold"><Icon name="trash-2" size={20} /></button>}
                                            <button onClick={handleSave} className="flex-1 py-4 bg-blue-600 text-white font-bold rounded-xl shadow-lg">Save</button>
                                        </div>
                                    ) : (
                                        <button onClick={closeModal} className="w-full py-4 bg-slate-800 text-white font-bold rounded-xl">Close View</button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
